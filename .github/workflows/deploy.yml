name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Deploy frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/*"
          target: ${{ secrets.VPS_WEBROOT }}
          strip_components: 1

      - name: Deploy backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "backend/server.js,backend/db.js,backend/config.js,backend/package.json,backend/scripts/gen-secret.js"
          target: /var/www/noor-studio/backend
          strip_components: 1

      - name: Restart backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/noor-studio/backend
            if [ ! -f .env ]; then
              echo "❌  /var/www/noor-studio/backend/.env is missing."
              echo "    Create it (with a strong JWT_SECRET) before deploying — see .env.example."
              echo "    Generate values: node scripts/gen-secret.js \"your-password\""
              exit 1
            fi
            npm install --omit=dev
            export NODE_ENV=production
            pm2 restart noor-backend --update-env || pm2 start server.js --name noor-backend --update-env
            pm2 save
