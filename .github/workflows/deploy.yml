name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Frontend (Node 20) ──
      - name: Setup Node.js 20 (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      # ── Backend deps (Node 18 — must match the server's Node 18 ABI) ──
      - name: Setup Node.js 18 (backend)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies (production only)
        run: |
          cd backend
          npm ci --omit=dev || npm install --omit=dev

      - name: Package backend (code + node_modules)
        run: tar -czf backend.tar.gz backend

      # ── Ship to VPS ──
      - name: Deploy frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/*"
          target: ${{ secrets.VPS_WEBROOT }}
          strip_components: 1

      - name: Upload backend bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "backend.tar.gz"
          target: /var/www/noor-studio

      - name: Extract & restart backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/noor-studio
            if [ ! -f backend/.env ]; then
              echo "❌  backend/.env is missing — create it first (see backend/.env.example)."
              exit 1
            fi
            # extract over existing backend/ — overwrites code+node_modules, keeps .env and uploads/
            tar -xzf backend.tar.gz
            rm -f backend.tar.gz
            # ensure the systemd unit exists (idempotent — infra as code)
            printf '%s\n' \
              '[Unit]' 'Description=Noor Studio Backend (Node + SQLite)' 'After=network.target' \
              '[Service]' 'Type=simple' 'WorkingDirectory=/var/www/noor-studio/backend' \
              'ExecStart=/usr/bin/node server.js' 'Restart=always' 'RestartSec=3' \
              'Environment=NODE_ENV=production' 'User=root' \
              '[Install]' 'WantedBy=multi-user.target' \
              > /etc/systemd/system/noor-backend.service
            systemctl daemon-reload
            systemctl enable noor-backend
            systemctl restart noor-backend
            sleep 2
            systemctl is-active noor-backend
