version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data.json:/app/data.json
    environment:
      - PORT=4000
      - JWT_SECRET=change_this_secret
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=noor1234
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
